---
configuration:
  start_folder:
    name: Start folder
    description: >-
      The folder Claude starts in, for example a folder of your own notes under /share.
      Empty starts in /homeassistant. Your config stays editable either way.
  oauth_token:
    name: OAuth token (optional)
    description: >-
      A token from `claude setup-token` on another computer. Leave empty and sign in
      from the Settings tab instead (recommended; it renews itself).
  remote_key:
    name: Remote console key (advanced)
    description: >-
      One ssh-ed25519 public key line. Leave empty to keep the remote console port closed.
  remote_allow_from:
    name: Remote console allowed from (advanced)
    description: >-
      The address(es) the remote key may log in from, for example 192.168.1.20 or
      192.168.1.0/24, comma-separated. Required with a remote key.
network:
  22/tcp: Remote console (ssh, key only; closed unless a remote key is set)
