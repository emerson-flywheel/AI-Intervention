# Front door on :3000 -> Norish on 127.0.0.1:3001.
# Norish sends X-Frame-Options: DENY on every page, which would leave the HA Recipes panel
# (an iframe) blank. This is the one thing nginx changes; everything else passes through.
# The Cloudflare tunnel comes in on 127.0.0.1:3002 instead, which keeps X-Frame-Options (no
# other site may frame Norish from the internet) and passes on the https the browser used.
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 512;
}

http {
    access_log off;
    client_max_body_size 200m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Home: the network and the HA Recipes tab.
    server {
        listen 3000;

        # Signing in with Home Assistant (ha-sso.mjs): only these two pages, by exact path.
        # Its token, userinfo and keys stay on 127.0.0.1 for Norish alone.
        location = /ha-sso/start {
            proxy_pass http://127.0.0.1:3003/ha-sso/start$is_args$args;
            proxy_set_header Host $http_host;
        }
        location = /ha-sso/authorize {
            proxy_pass http://127.0.0.1:3003/ha-sso/authorize$is_args$args;
            proxy_set_header Host $http_host;
        }

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Real-time updates and the recipe export stream: no buffering, long reads.
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_hide_header X-Frame-Options;
        }
    }

    # Tunnel: only cloudflared, in this container, can reach it.
    server {
        listen 127.0.0.1:3002;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Real-time updates and the recipe export stream: no buffering, long reads.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }

    # Home Assistant ingress: the Recipes sidebar entry (/), and Norish's API (/api/v1, plus
    # /api/trpc for what v1 lacks, such as editing a recipe; both still need a Norish API
    # key), so tools signed in to HA can reach it without port 3000. Norish's pages need the
    # site root, so they are framed from port 3000 rather than served here.
    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;

        location ~ ^/api/(v1|trpc)/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5m;
        }

        # The Recipes sidebar entry: frames Norish, signed in as the HA user's Norish account
        # when ha_users lists them. Supervisor sets X-Remote-User-* from the HA sign-in and
        # drops any a browser sends; only Supervisor (above) reaches this server.
        location = / {
            proxy_pass http://127.0.0.1:3004/;
            proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
            proxy_set_header X-Remote-User-Name $http_x_remote_user_name;
            proxy_set_header X-Remote-User-Display-Name $http_x_remote_user_display_name;
        }

        location / {
            default_type text/html;
            return 200 '<!doctype html><meta charset="utf-8"><title>Norish</title><p style="font-family:sans-serif;margin:2em">Norish opens from <b>Recipes</b> in the sidebar, or at the address in this app&rsquo;s <code>url</code> setting.</p>';
        }
    }
}
