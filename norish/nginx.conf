# Front door on :3000 -> Norish on 127.0.0.1:3001.
# Norish sends X-Frame-Options: DENY on every page, which would leave the HA Recipes panel
# (an iframe) blank. This is the one thing nginx changes; everything else passes through.
# The Cloudflare tunnel comes in on 127.0.0.1:3002 instead, which keeps X-Frame-Options (no
# other site may frame Norish from the internet) and passes on the https the browser used.
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 512;
}

http {
    access_log off;
    client_max_body_size 200m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Home: the network and the HA Recipes tab.
    server {
        listen 3000;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Real-time updates and the recipe export stream: no buffering, long reads.
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_hide_header X-Frame-Options;
        }
    }

    # Tunnel: only cloudflared, in this container, can reach it.
    server {
        listen 127.0.0.1:3002;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Real-time updates and the recipe export stream: no buffering, long reads.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }

    # Home Assistant ingress: Norish's API only (/api/v1, plus /api/trpc for what v1 lacks,
    # such as editing a recipe; both still need a Norish API key), so tools signed in to HA
    # can reach it without port 3000. Norish's pages need the site root, so they are not
    # served here; this page points to the Recipes tab.
    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;

        location ~ ^/api/(v1|trpc)/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5m;
        }

        location / {
            default_type text/html;
            return 200 '<!doctype html><meta charset="utf-8"><title>Norish</title><p style="font-family:sans-serif;margin:2em">Norish opens from the <b>Recipes</b> tab in the sidebar, or at the address in this app&rsquo;s <code>url</code> setting.</p>';
        }
    }
}
