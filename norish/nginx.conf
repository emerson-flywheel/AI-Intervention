# Front door on :3000 -> Norish on 127.0.0.1:3001.
# Norish sends X-Frame-Options: DENY on every page, which would leave the HA Recipes panel
# (an iframe) blank. This is the one thing nginx changes; everything else passes through.
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 512;
}

http {
    access_log off;
    client_max_body_size 200m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 3000;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Real-time updates and the recipe export stream: no buffering, long reads.
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_hide_header X-Frame-Options;
        }
    }
}
